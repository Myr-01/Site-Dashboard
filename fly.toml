# Site Monitor — Fly.io konfiqurasiyası
#
# DİQQƏT — bu tətbiq YALNIZ bir maşında işləməlidir:
#   1. Məlumat SQLite-dədir və volume tək maşına bağlıdır. İkinci maşın öz ayrı
#      volume-unu alar və iki fərqli baza yaranar.
#   2. Monitorinq dövrü (`setInterval`) və `lastCheckedMap` proses yaddaşındadır.
#      İki maşın hər saytı iki dəfə yoxlayar və bildirişlər dublikat gələr.
# Ona görə `fly scale count 1` saxlanılmalıdır.

app = 'site-dashboard-monitor'
primary_region = 'fra'   # Frankfurt — Azərbaycana ən yaxın Fly regionlarından biri

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  # SQLite, backup-lar və yüklənmiş fayllar mount olunmuş volume-da yaşayır
  DATA_DIR = '/data'

[http_service]
  internal_port = 3001
  force_https = true

  # KRİTİK: auto_stop söndürülüb.
  # Fly default olaraq HTTP trafiki olmayanda maşını dayandırır. Bu, monitoring
  # tətbiqi üçün yolverilməzdir — heç kim panelə baxmasa da saytlar yoxlanmalı,
  # bildirişlər getməli, gündəlik backup və cleanup işləməlidir.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 150
    hard_limit = 250

  # Health check — /api/sites yerinə yüngül endpoint (N+1 sorğu etmir)
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

# Persistent volume — bunsuz hər deploy-da bütün məlumat itər.
# `source` mövcud volume-un adı ilə eyni olmalıdır (`fly volumes list`).
[[mounts]]
  source = 'site_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  # Hazırda işləyən maşınla eyni saxlanılıb (dəyişdirilsə hesablaşma da dəyişir).
  # DİQQƏT: 256MB darısqaldır — canlı ölçmə 207MB-dan 93MB istifadə, ~101MB boş.
  # WordPress `.wpress` backup analizi (adm-zip böyük faylı yaddaşa açır) bu həddi
  # aşa bilər. Backup analizi istifadə edəcəksənsə: fly scale memory 512
  memory = '256mb'
  cpus = 1
